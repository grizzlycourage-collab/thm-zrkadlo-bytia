<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zrkadlo Bytia · The Human Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #060810;
            --card: #0d1428;
            --border: #1e2a4a;
            --text: #e8edf5;
            --muted: #6a7a9a;
            --accent: #6d8cff;
            --glow: rgba(109, 140, 255, 0.15);
            --radius: 18px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }

        body.female {
            --accent: #f472b6;
            --glow: rgba(244, 114, 182, 0.15);
        }

        .app {
            max-width: 680px;
            width: 100%;
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 28px 24px 20px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        /* HLAVIČKA */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #a0b8ff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo span {
            display: block;
            font-size: 0.65rem;
            font-weight: 400;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            -webkit-text-fill-color: var(--muted);
        }

        .lang-selector {
            display: flex;
            gap: 3px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 30px;
            padding: 3px;
            border: 1px solid var(--border);
        }

        .lang-selector button {
            background: transparent;
            border: none;
            color: var(--muted);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            text-transform: uppercase;
        }

        .lang-selector button.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 20px var(--glow);
        }

        /* FORMULÁR */
        .form-section {
            margin-bottom: 6px;
            transition: opacity 0.5s;
        }

        .form-section.hidden {
            display: none;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--muted);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            background: #080c1a;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            transition: 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--glow);
        }

        .form-group input::placeholder {
            color: var(--muted);
            opacity: 0.4;
        }

        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1.4fr;
            gap: 10px;
        }

        .date-row select {
            padding: 13px 10px;
            background: #080c1a;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .date-row select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--glow);
        }

        /* PREPÍNANIE POHLAVIA */
        .gender-toggle {
            display: flex;
            gap: 10px;
            background: #080c1a;
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--border);
        }

        .gender-toggle button {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.25s;
        }

        .gender-toggle button.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 20px var(--glow);
        }

        /* TLAČIDLO */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            margin-top: 6px;
            box-shadow: 0 0 30px var(--glow);
        }

        .btn-primary:hover {
            transform: scale(1.01);
            box-shadow: 0 0 50px var(--glow);
        }

        /* VÝSLEDKY */
        .results-container {
            display: none;
            margin-top: 10px;
        }

        .results-container.active {
            display: block;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px 22px;
            margin-bottom: 14px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .card .phase {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .card .phase h3 {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--accent);
        }

        .card .phase .tag {
            font-size: 0.55rem;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid var(--border);
        }

        .card p {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #d0d8e8;
            margin-top: 4px;
        }

        /* PROGRESS */
        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 16px 0 12px;
        }

        .progress-dots .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--border);
            transition: 0.3s;
        }

        .progress-dots .dot.active {
            background: var(--accent);
            box-shadow: 0 0 16px var(--glow);
            transform: scale(1.2);
        }

        .progress-dots .dot.done {
            background: var(--accent);
            opacity: 0.3;
        }

        .btn-next {
            display: block;
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            letter-spacing: 1px;
        }

        .btn-next:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
        }

        .btn-restart {
            display: block;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--muted);
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            margin-top: 8px;
        }

        .btn-restart:hover {
            border-color: var(--accent);
            color: #fff;
        }

        /* PÄTA */
        .footer {
            margin-top: 28px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.6rem;
            color: var(--muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .footer strong {
            color: var(--accent);
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .app {
                padding: 18px 14px 16px;
            }

            .logo h1 {
                font-size: 1.2rem;
            }

            .card {
                padding: 18px 14px;
            }

            .card p {
                font-size: 0.9rem;
            }

            .date-row {
                grid-template-columns: 1fr 1fr 1.2fr;
                gap: 6px;
            }

            .date-row select {
                padding: 11px 6px;
                font-size: 0.9rem;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .lang-selector {
                align-self: flex-start;
            }
        }
    </style>
</head>

                    "Další fáze života vás vyzývá k přechodu od boje proti chybám světa k budování vlastního bezpečného přístavu. Získáte hlubokou nezávislost a rovnováhu, jakmile přestanete plýtvat energií na nápravu lidí, kteří o to nestojí.",
                    "Vývoj směřuje k vnitřnímu průlomu a osvobození od minulých břemen. Před vámi je období, kdy se vaše zkušenosti spojí s čistým záměrem tvořit hodnoty, které přežijí."
                ],

                ],
                override: [
                    "Etický Override: Tento systém ruší všechny staré programy strachu, viny a závislosti na cizích míněních. Odpojujete se od kolektivních dogmat, masové hysterie a potřeby zapadat tam, kde ztrácíte sebe. Vaše volba odteď: Žádné další kulty ani autority. Kráčíte ve jménu vlastní čistoty a klidu, přičemž konáte dobro tam, kde to má reálný smysl.",
                    "Etický Override: Definitivní přetržení řetězů. Uvědomte si, že skutečná svoboda nepřichází zvenčí, ale z vnitřní rozhodnosti nekomplikovat si život cizími dramaty. Tento bod vás vrací k vaší esenciální síle – pomáháte tam, kde je to čisté, ale berete si zpět plnou odpovědnost za vlastní energii.",
                    "Etický Override: Mentální restart a návrat k suverenitě. Zbavujete se potřeby bojovat proti lžím tohoto světa. Vaší nejsilnější zbraní už není odpor, ale absolutní vnitřní klid a život v pravdě bez potřeby přesvědčovat o ní jiné."

                    "Dnes se vyhněte pasti dokazování své pravdy za každou cenu. Vesmír vám testuje míru trpělivosti. Zůstaňte v chladném, laskavém nadhledu a nenechte se vtáhnout do cizích dramat.",
                    "Dnes platí pravidlo: Méně řečí, více čistého konání. Svůj ostrý intelekt dnes použijte na úklid vlastního prostoru, ne na hodnocení okolí. Hlídejte si své hranice s úsměvem."
                ],
                daily: [
                    "Denní kód rezonance ti připomíná, že tvá stabilita je v tvých rukou. Nenech se vykolejit vnějšími otřesy – jsou to jen vlny na hladině.",
                    "Dnes se soustřeď na jednoduché věci: dech, ticho, jeden čistý krok. Tvá energie se sama uspořádá, pokud jí přestaneš překážet.",
                    "Přijmi dnešek takový, jaký je. Žádný boj, žádné přesvědčování. Tvá přítomnost mluví víc než tisíce slov."

            }
        };

        // ============================================================
        // 3. POMOCOVNÉ FUNKCIE
        // ============================================================

        function getAdjustedBirthDate(year, month, day) {
            const d = new Date(year, month - 1, day);
            d.setDate(d.getDate() - 88);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${y}${m}${dd}`;
        }

        function numerologySum(str) {
            let sum = 0;
            for (let ch of str) {
                let d = parseInt(ch);
                if (!isNaN(d)) sum += d;
            }
            while (sum > 9 && sum !== 11 && sum !== 22 && sum !== 33) {
                sum = String(sum).split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
            }
            return sum;
        }

        function nameToNumber(name) {
            const map = {
                'a': 1, 'á': 1, 'ä': 1, 'b': 2, 'c': 3, 'č': 3, 'd': 4, 'ď': 4,
                'e': 5, 'é': 5, 'ě': 5, 'f': 6, 'g': 7, 'h': 8, 'ch': 8, 'i': 9,
                'í': 9, 'j': 1, 'k': 2, 'l': 3, 'm': 4, 'n': 5, 'ň': 5, 'o': 6,
                'ó': 6, 'ô': 6, 'p': 7, 'q': 8, 'r': 9, 'ř': 9, 's': 1, 'š': 1,
                't': 2, 'ť': 2, 'u': 3, 'ú': 3, 'ů': 3, 'v': 4, 'w': 5, 'x': 6,
                'y': 7, 'ý': 7, 'z': 8, 'ž': 8
            };
            let clean = name.toLowerCase().replace(/[^a-záäčďéěíňóôřšťúůýž]/g, '');
            let sum = 0;
            for (let ch of clean) {
                if (map[ch]) sum += map[ch];
            }
            while (sum > 9 && sum !== 11 && sum !== 22 && sum !== 33) {
                sum = String(sum).split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
            }
            return sum;
        }

        // ============================================================
        // 4. APLIKÁCIA
        // ============================================================

        const app = {
            init() {
                this.cacheDom();
                this.bindEvents();
                this.populateDates();
                this.updateLanguage('sk');
            },

            cacheDom() {
                this.dom = {
                    langButtons: document.querySelectorAll('.lang-selector button'),
                    fullName: document.getElementById('fullName'),
                    birthDay: document.getElementById('birthDay'),
                    birthMonth: document.getElementById('birthMonth'),
                    birthYear: document.getElementById('birthYear'),
                    genderButtons: document.querySelectorAll('.gender-toggle button'),
                    btnStart: document.getElementById('btnStart'),
                    formSection: document.getElementById('formSection'),
                    resultsContainer: document.getElementById('resultsContainer'),
                    cardsWrapper: document.getElementById('cardsWrapper'),
                    progressDots: document.getElementById('progressDots'),
                    btnNext: document.getElementById('btnNext'),
                    btnRestart: document.getElementById('btnRestart'),
                    subBrand: document.getElementById('subBrand'),
                };
                this.currentCard = -1;
                this.totalCards = 10;
                this.seed = 0;
                this.lifePath = 0;
                this.destiny = 0;
                this.gender = 'm';
                this.name = '';
                this.lang = 'sk';
                this.cardsData = [];
            },

            bindEvents() {
                this.dom.langButtons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.updateLanguage(btn.dataset.lang);
                    });
                });

                this.dom.genderButtons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.dom.genderButtons.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.gender = btn.dataset.gender;
                        document.body.className = this.gender === 'f' ? 'female' : '';
                    });
                });

                this.dom.btnStart.addEventListener('click', () => this.startAnalysis());

                this.dom.btnNext.addEventListener('click', () => this.nextCard());

                this.dom.btnRestart.addEventListener('click', () => this.restart());

                this.dom.fullName.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') this.startAnalysis();
                });
            },

            populateDates() {
                // Dni
                const daySel = this.dom.birthDay;
                for (let i = 1; i <= 31; i++) {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = i;
                    daySel.appendChild(opt);
                }

                // Roky
                const yearSel = this.dom.birthYear;
                const curYear = new Date().getFullYear();
                for (let y = curYear; y >= 1920; y--) {
                    const opt = document.createElement('option');
                    opt.value = y;
                    opt.textContent = y;
                    yearSel.appendChild(opt);
                }
            },

            updateLanguage(lang) {
                this.lang = lang;
                const t = LANG[lang];
                if (!t) return;

                this.dom.langButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === lang);
                });

                document.getElementById('lblName').textContent = t.name;
                this.dom.fullName.placeholder = t.namePlaceholder;
                document.getElementById('lblBirth').textContent = t.birth;
                document.getElementById('lblGender').textContent = t.gender;
                this.dom.genderButtons.forEach(btn => {
                    if (btn.dataset.gender === 'm') btn.textContent = t.male;
                    else btn.textContent = t.female;
                });
                this.dom.btnStart.textContent = t.start;
                this.dom.btnNext.textContent = t.next;
                this.dom.btnRestart.textContent = t.restart;
                this.dom.subBrand.textContent = t.brand;

                if (this.dom.resultsContainer.classList.contains('active')) {
                    this.renderCards();
                }
            },

            startAnalysis() {
                const name = this.dom.fullName.value.trim();
                const day = this.dom.birthDay.value;
                const month = this.dom.birthMonth.value;
                const year = this.dom.birthYear.value;

                if (!name || !day || !month || !year) {
                    alert(LANG[this.lang].alert);
                    return;
                }

                this.name = name;

                // výpočet s korekciou 88 dní
                const adjusted = getAdjustedBirthDate(parseInt(year), parseInt(month), parseInt(day));
                this.lifePath = numerologySum(adjusted);
                this.destiny = nameToNumber(name);
                const genderOffset = this.gender === 'f' ? 1 : 0;
                this.seed = (this.lifePath * 7 + this.destiny * 13 + parseInt(year) + genderOffset) % 3;

                this.prepareCards();

                this.dom.formSection.style.display = 'none';
                this.dom.resultsContainer.classList.add('active');

                this.currentCard = -1;
                this.nextCard();
            },

            prepareCards() {
                const db = TEXT_DB[this.lang] || TEXT_DB.sk;
                const s = this.seed;
                const phases = LANG[this.lang].phases;
                const tags = LANG[this.lang].tags;
                const keys = ['childhood', 'teen', 'adult', 'today', 'shadow', 'future', 'motivation', 'override', 'radar', 'daily'];

                this.cardsData = keys.map((key, idx) => {
                    const texts = db[key] || db.childhood;
                    const text = texts[s % texts.length];
                    const phaseName = phases[idx] || key;
                    const tagText = tags[idx] || '';
                    return { phase: phaseName, tag: tagText, text };
                });
            },

            renderCards() {
                const wrapper = this.dom.cardsWrapper;
                wrapper.innerHTML = '';
                this.cardsData.forEach((card, idx) => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.dataset.index = idx;
                    div.innerHTML = `
                        <div class="phase">
                            <h3>${card.phase}</h3>
                            <span class="tag">${card.tag}</span>
                        </div>
                        <p>${card.text}</p>
                    `;
                    wrapper.appendChild(div);
                });
                this.updateDots();
            },

            updateDots() {
                const container = this.dom.progressDots;
                container.innerHTML = '';
                for (let i = 0; i < this.totalCards; i++) {
                    const dot = document.createElement('span');
                    dot.className = 'dot';
                    if (i === this.currentCard) dot.classList.add('active');
                    else if (i < this.currentCard) dot.classList.add('done');
                    container.appendChild(dot);
                }
                const t = LANG[this.lang];
                if (this.currentCard === this.totalCards - 1) {
                    this.dom.btnNext.textContent = '✧ Dokončiť';
                } else {
                    this.dom.btnNext.textContent = t.next;
                }
            },

            nextCard() {
                if (this.currentCard >= this.totalCards - 1) {
                    return;
                }

                this.currentCard++;
                const cards = this.dom.cardsWrapper.querySelectorAll('.card');
                cards.forEach((card, idx) => {
                    if (idx <= this.currentCard) {
                        card.style.display = 'block';
                        setTimeout(() => card.classList.add('visible'), 50);
                    } else {
                        card.classList.remove('visible');
                        card.style.display = 'none';
                    }
                });

                if (this.currentCard === this.totalCards - 1) {
                    this.dom.btnNext.textContent = '✧ Dokončiť';
                } else {
                    this.dom.btnNext.textContent = LANG[this.lang].next;
                }

                this.updateDots();

                const cardEl = cards[this.currentCard];
                if (cardEl) {
                    cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            },

            restart() {
                this.dom.resultsContainer.classList.remove('active');
                this.dom.formSection.style.display = 'block';
                this.currentCard = -1;
                this.dom.cardsWrapper.innerHTML = '';
                this.dom.progressDots.innerHTML = '';
                this.dom.btnNext.textContent = LANG[this.lang].next;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        document.addEventListener('DOMContentLoaded', () => app.init());
        window.app = app;
    })();
</script>
